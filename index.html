<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador OLED & LED</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Simulador Display OLED (128x64) & LED</h1>

  <div class="container">
    <!-- LED Físico Simulado -->
    <div class="led-box">
      <div id="led" class="led-off"></div>
      <p>Status do LED: <span id="led-status">DESLIGADO</span></p>
    </div>

    <!-- Tela OLED Simulada -->
    <div class="oled-box">
      <canvas id="oledScreen" width="128" height="64"></canvas>
    </div>
  </div>

  <div class="controls">
    <button onclick="toggleLED()">Alternar LED</button>
    <button onclick="drawOLEDText()">Escrever no OLED</button>
    <button onclick="clearOLED()">Limpar Tela</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
